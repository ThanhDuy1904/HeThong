<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý tài khoản - TEDU</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="sidebar-brand"><span>🎓</span> TEDU Admin</div><nav class="sidebar-nav"><div class="nav-section">Quản trị</div></nav>
    <div class="sidebar-footer"><div class="user-info"><div class="user-avatar"><i class="fa fa-user"></i></div><div><div class="user-name" id="sidebar-username">---</div><div class="user-role" id="sidebar-role">---</div></div></div><button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button></div>
  </aside>
  <main class="main-content"><div class="topbar"><div class="topbar-title"><i class="fa fa-users-cog"></i> Quản lý tài khoản</div><span id="top-user"></span></div>
    <div class="page-body"><div class="card"><div class="card-header"><span>Tất cả tài khoản hệ thống</span><button class="btn btn-primary" onclick="openAccountModal()"><i class="fa fa-plus"></i> Tạo tài khoản</button></div>
      <div class="card-body"><div class="search-bar"><input id="account-search" placeholder="Tìm tên, tài khoản, email..." oninput="renderAccounts()"><select id="role-filter" onchange="renderAccounts()"><option value="">Tất cả vai trò</option></select></div></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Họ tên</th><th>Tài khoản</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="accounts-body"></tbody></table></div>
    </div></div>
  </main>
</div>
<div class="modal-backdrop" id="account-modal"><div class="modal"><div class="modal-header"><span id="modal-title">Tạo tài khoản</span><button class="modal-close" onclick="closeModal('account-modal')">✕</button></div>
  <div class="modal-body"><div id="modal-alert"></div><form id="account-form"><input type="hidden" id="account-id">
    <div class="form-grid"><div class="form-group full"><label>Họ và tên *</label><input id="a-fullName" required></div><div class="form-group"><label>Tên đăng nhập *</label><input id="a-username" required></div><div class="form-group"><label>Mật khẩu <span id="password-hint">(bắt buộc)</span></label><input id="a-password" type="password"></div><div class="form-group"><label>Email</label><input id="a-email" type="email"></div><div class="form-group"><label>Vai trò *</label><select id="a-role"><option>ADMIN</option><option>TEACHER</option><option>STUDENT</option><option>ACADEMIC_AFFAIRS</option><option>MANAGER</option><option>ACCOUNTANT</option><option>CONTENT_MANAGER</option></select></div><div class="form-group"><label>Trạng thái</label><select id="a-enabled"><option value="true">Đang hoạt động</option><option value="false">Đã khóa</option></select></div></div>
  </form></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('account-modal')">Hủy</button><button class="btn btn-primary" onclick="saveAccount()"><i class="fa fa-save"></i> Lưu</button></div>
</div></div>
<script src="../js/api.js"></script><script>
let accounts=[], editingId=null;
const roles=['ADMIN','TEACHER','STUDENT','ACADEMIC_AFFAIRS','MANAGER','ACCOUNTANT','CONTENT_MANAGER'];
document.addEventListener('DOMContentLoaded', async()=>{if(!requireAuth()||!isAdmin())return;renderUserInfo();document.getElementById('role-filter').innerHTML='<option value="">Tất cả vai trò</option>'+roles.map(r=>`<option>${r}</option>`).join('');await loadAccounts();});
async function loadAccounts(){try{const r=await api.accounts.getAll();accounts=r.data||[];renderAccounts();}catch(e){showToast(e.message,'error');}}
function renderAccounts(){const q=(document.getElementById('account-search').value||'').toLowerCase(), role=document.getElementById('role-filter').value;const rows=accounts.filter(a=>(!role||a.role===role)&&(!q||[a.fullName,a.username,a.email,a.role].some(v=>(v||'').toLowerCase().includes(q))));document.getElementById('accounts-body').innerHTML=rows.length?rows.map((a,i)=>`<tr><td>${i+1}</td><td><strong>${a.fullName}</strong></td><td>${a.username}</td><td>${a.email||'—'}</td><td><span class="badge badge-info">${a.role}</span></td><td><span class="badge ${a.enabled?'badge-success':'badge-danger'}">${a.enabled?'Hoạt động':'Đã khóa'}</span></td><td><button class="btn btn-warning btn-sm" onclick='editAccount(${JSON.stringify(a)})'><i class="fa fa-edit"></i></button> <button class="btn btn-danger btn-sm" onclick="deleteAccount(${a.id})"><i class="fa fa-trash"></i></button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:30px;color:#888">Không có tài khoản</td></tr>';}
function openAccountModal(a=null){editingId=a?.id||null;document.getElementById('modal-title').textContent=editingId?'Cập nhật tài khoản':'Tạo tài khoản';document.getElementById('account-id').value=editingId||'';document.getElementById('a-fullName').value=a?.fullName||'';document.getElementById('a-username').value=a?.username||'';document.getElementById('a-email').value=a?.email||'';document.getElementById('a-role').value=a?.role||'STUDENT';document.getElementById('a-enabled').value=String(a?.enabled??true);document.getElementById('a-password').value='';document.getElementById('password-hint').textContent=editingId?'(để trống nếu không đổi)':'(bắt buộc)';document.getElementById('account-modal').classList.add('show');}
function editAccount(a){openAccountModal(a);}
async function saveAccount(){const data={fullName:document.getElementById('a-fullName').value.trim(),username:document.getElementById('a-username').value.trim(),password:document.getElementById('a-password').value,email:document.getElementById('a-email').value.trim(),role:document.getElementById('a-role').value,enabled:document.getElementById('a-enabled').value==='true'};try{if(editingId)await api.accounts.update(editingId,data);else await api.accounts.create(data);closeModal('account-modal');await loadAccounts();showToast('Đã lưu tài khoản','success');}catch(e){document.getElementById('modal-alert').innerHTML=`<div class="alert alert-error">${e.message}</div>`;}}
async function deleteAccount(id){if(!confirm('Bạn chắc chắn muốn xóa tài khoản này?'))return;try{await api.accounts.delete(id);await loadAccounts();showToast('Đã xóa tài khoản','success');}catch(e){showToast(e.message,'error');}}
</script></body></html>
