<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Doanh thu - TEDU</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .revenue-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.revenue-filters label{display:flex;flex-direction:column;gap:5px;font-weight:600}.revenue-filters input,.revenue-filters select{padding:10px;border:1px solid #d8dbea;border-radius:8px}
    .revenue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.revenue-card{padding:18px;border-radius:12px;background:#f7f8ff;border:1px solid #e3e5fa}.revenue-card .value{font-size:1.25rem;font-weight:700;margin-top:8px}.chart{height:260px;display:flex;align-items:end;gap:7px;padding:20px 8px 0;border-bottom:1px solid #d8dbea}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;font-size:.72rem}.bar{width:100%;max-width:34px;background:#5d5bea;border-radius:5px 5px 0 0;min-height:2px}.bar-label{white-space:nowrap}.bar-value{font-size:.65rem;color:#555}
  </style>
</head>
<body><div class="layout"><aside class="sidebar"><div class="sidebar-brand"><span>🎓</span> TEDU</div><nav class="sidebar-nav"></nav><div class="sidebar-footer"><div class="user-info"><div class="user-avatar"><i class="fa fa-user"></i></div><div><div class="user-name" id="sidebar-username">---</div><div class="user-role" id="sidebar-role">---</div></div></div><button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button></div></aside>
<main class="main-content"><div class="topbar"><div class="topbar-title"><i class="fa fa-chart-bar"></i> Doanh thu</div></div><div class="page-body">
<div class="card"><div class="card-body"><div class="revenue-filters"><label>Năm học<select id="schoolYear"><option value="">Mặc định năm học hiện tại</option></select></label><label>Năm<input id="year" type="number" min="2000" max="2100"></label><label>Tháng<select id="month"><option value="">Cả năm</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></label><button class="btn btn-primary" onclick="loadReport()"><i class="fa fa-filter"></i> Xem báo cáo</button></div></div></div>
<div class="revenue-grid" id="summary"></div>
<div class="card"><div class="card-header">Biểu đồ tiền đã thu theo tháng</div><div class="card-body"><div class="chart" id="chart"></div></div></div>
<div class="card"><div class="card-header">Thu học phí theo lớp</div><div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Năm học</th><th>Phải thu</th><th>Đã thu</th><th>Còn lại</th><th>Chưa thu</th></tr></thead><tbody id="byClass"></tbody></table></div></div>
</div></main></div>
<script src="../js/api.js"></script><script>
const money=v=>Number(v||0).toLocaleString('vi-VN')+' đ';
document.addEventListener('DOMContentLoaded',async()=>{if(!requireAuth()||!['ADMIN','MANAGER'].includes(getUser()?.role))return;renderUserInfo();document.getElementById('year').value=new Date().getFullYear();try{const r=await api.classes.getAll();const years=[...new Set((r.data||[]).map(c=>c.schoolYear).filter(Boolean))];document.getElementById('schoolYear').innerHTML='<option value="">Mặc định năm học hiện tại</option>'+years.map(y=>`<option>${y}</option>`).join('')}catch(e){}await loadReport()});
async function loadReport(){try{const r=await api.revenue.report(document.getElementById('schoolYear').value,document.getElementById('year').value,document.getElementById('month').value);const d=r.data||{};const cards=[['Tổng đã thu',d.totalCollected],['Tổng phải thu',d.totalDue],['Tổng còn lại',d.totalRemaining],['Tổng chưa thu',d.totalUncollected],['Tổng chi',d.totalExpense]];document.getElementById('summary').innerHTML=cards.map(x=>`<div class="revenue-card"><div>${x[0]}</div><div class="value">${money(x[1])}</div></div>`).join('');const months=d.monthly||[];const max=Math.max(1,...months.map(x=>Number(x.collected||x.amount||0)));document.getElementById('chart').innerHTML=months.map((x,i)=>{const v=Number(x.collected||x.amount||0);return `<div class="bar-wrap"><span class="bar-value">${money(v)}</span><div class="bar" style="height:${Math.max(2,v/max*200)}px"></div><span class="bar-label">T${x.month||i+1}</span></div>`}).join('');document.getElementById('byClass').innerHTML=(d.byClass||[]).map(x=>`<tr><td>${x.className||'—'}</td><td>${x.schoolYear||'—'}</td><td>${money(x.totalDue)}</td><td>${money(x.collected||x.totalCollected)}</td><td>${money(x.remaining)}</td><td>${money(x.uncollected||x.remaining)}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:25px">Chưa có dữ liệu</td></tr>'}catch(e){showToast(e.message,'error')}}
</script></body></html>
