<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học sinh của tôi – TEDU</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><span>🎓</span> TEDU Teacher</div>
    <nav class="sidebar-nav">
      <div class="nav-section">Chính</div>
      <div class="nav-item" onclick="location.href='attendance.html'"><i class="fa fa-clipboard-check"></i> Điểm danh</div>
      <div class="nav-item" onclick="location.href='classes.html'"><i class="fa fa-school"></i> Lớp học của tôi</div>
      <div class="nav-item active" onclick="location.href='students.html'"><i class="fa fa-user-graduate"></i> Học sinh của tôi</div>
      <div class="nav-item" onclick="location.href='timetable.html'"><i class="fa fa-calendar"></i> Thời khóa biểu</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"><i class="fa fa-user"></i></div>
        <div>
          <div class="user-name" id="sidebar-username">---</div>
          <div class="user-role" id="sidebar-role">---</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><i class="fa fa-user-graduate"></i> Học sinh của tôi</div>
    </div>
    <div class="page-body">
      <div class="card">
        <div class="card-header">
          <span>Danh sách học sinh trong các lớp phụ trách</span>
          <button class="btn btn-outline" onclick="loadStudents()"><i class="fa fa-sync"></i> Tải lại</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Họ tên</th><th>Lớp</th><th>Ngày sinh</th><th>SĐT</th><th>Phụ huynh</th><th>Trạng thái</th><th>Học phí</th></tr>
            </thead>
            <tbody id="students-body"></tbody>
          </table>
        </div>
        <div style="padding:14px 24px;color:#888;font-size:.85rem" id="table-info"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  let teacherInfo = null;
  let teacherClassIds = [];
  let teacherStudents = [];

  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    if (getUser()?.role !== 'TEACHER') window.location.href = '../user/dashboard.html';
    renderUserInfo();
    await loadStudents();
  });

  async function loadStudents() {
    try {
      if (!teacherInfo) {
        const me = await api.teachers.getMe();
        teacherInfo = me.data;
      }
      const classesRes = await api.classes.getAll();
      const classes = classesRes.data || [];
      teacherClassIds = classes.filter(c => String(c.teacherId || '') === String(teacherInfo.id || '')).map(c => c.id);

      const results = await Promise.all(teacherClassIds.map(classId => api.students.byClass(classId).catch(() => ({ data: [] }))));
      teacherStudents = results.flatMap((res, index) => (res.data || []).map(student => ({ ...student, teacherClassId: teacherClassIds[index] })));
      renderTable(classes);
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  function renderTable(classes) {
    const classMap = new Map((classes || []).map(c => [String(c.id), c.className]));
    const tbody = document.getElementById('students-body');
    document.getElementById('table-info').textContent = `Hiển thị ${teacherStudents.length} học sinh`;

    if (!teacherStudents.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#aaa;padding:30px">Chưa có học sinh trong các lớp của bạn</td></tr>';
      return;
    }

    tbody.innerHTML = teacherStudents.map((s, index) => `
      <tr>
        <td>${index + 1}</td>
        <td><strong>${s.fullName}</strong></td>
        <td>${s.className || classMap.get(String(s.teacherClassId)) || '—'}</td>
        <td>${s.dob ? new Date(s.dob).toLocaleDateString('vi-VN') : '—'}</td>
        <td>${s.phone || '—'}</td>
        <td>${s.parentName || '—'}</td>
        <td><span class="badge ${s.status === 'ACTIVE' ? 'badge-success' : s.status === 'GRADUATED' ? 'badge-info' : 'badge-danger'}">${s.status === 'ACTIVE' ? 'Đang học' : s.status === 'GRADUATED' ? 'Tốt nghiệp' : 'Nghỉ học'}</span></td>
        <td>${formatCurrency(s.classTuitionFee)}</td>
      </tr>
    `).join('');
  }

  function formatCurrency(v) {
    if (v === null || v === undefined || v === '') return '—';
    return Number(v).toLocaleString('vi-VN') + ' đ';
  }

  loadStudents();
</script>
</body>
</html>
