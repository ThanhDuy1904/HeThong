<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài đăng video – TEDU</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .posts-wrap { max-width: 1080px; margin: 30px auto; padding: 0 16px 30px; }
    .hero {
      background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
      color: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .post-card {
      border: 1px solid #e7ebf0;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.05);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(2, 6, 23, 0.1);
    }
    .post-card iframe {
      width: 100%;
      height: 220px;
      border: 0;
    }
    .post-body { padding: 14px; }
    .post-excerpt {
      margin: 0;
      color: #374151;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { color: #6b7280; font-size: .82rem; margin-top: 6px; }
    .detail-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, .55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .detail-modal {
      width: min(860px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(2, 6, 23, .25);
    }
    .detail-head {
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .detail-body { padding: 16px 18px 20px; }
    .detail-close {
      border: 0;
      background: transparent;
      font-size: 1.3rem;
      color: #64748b;
      cursor: pointer;
    }
  </style>
</head>
<body style="background:#f5f8fc">
  <div class="posts-wrap">
    <div class="hero">
      <div>
        <h2 style="margin:0 0 8px">🎬 Bảng tin video TEDU</h2>
        <p style="margin:0;opacity:.9">Trang mặc định của hệ thống. Xem nội dung mới nhất từ nhà trường.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn btn-outline" href="register.html" style="background:#fff">Đăng ký</a>
        <a class="btn btn-primary" href="login.html"><i class="fa fa-sign-in-alt"></i> Đăng nhập</a>
      </div>
    </div>

    <div id="post-grid" class="post-grid"></div>
  </div>

  <div id="post-detail" class="detail-backdrop" onclick="closePostDetail(event)">
    <div class="detail-modal">
      <div class="detail-head">
        <div id="detail-title" style="font-size:1.1rem;font-weight:700"></div>
        <button class="detail-close" onclick="closePostDetail()">✕</button>
      </div>
      <div class="detail-body">
        <div id="detail-media"></div>
        <div id="detail-tags" style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"></div>
        <p id="detail-content" style="white-space:pre-line;color:#1f2937;line-height:1.6;margin:0"></p>
        <div id="detail-meta" class="meta" style="margin-top:14px"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let postsCache = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadPosts();
    });

    async function loadPosts() {
      const wrap = document.getElementById('post-grid');
      wrap.innerHTML = '<div class="card" style="padding:18px">Đang tải bài đăng...</div>';
      try {
        const res = await api.posts.getPublished();
        const posts = res.data || [];
        postsCache = posts;
        if (!posts.length) {
          wrap.innerHTML = '<div class="card" style="padding:18px">Chưa có bài đăng video nào.</div>';
          return;
        }
        wrap.innerHTML = posts.map(p => `
          <article class="post-card" onclick="openPostDetail(${posts.indexOf(p)})" role="button" tabindex="0">
            ${renderMedia(p)}
            <div class="post-body">
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
                <h3 style="margin:0">${p.title}</h3>
                ${p.postType ? `<span class="badge badge-info">${labelPostType(p.postType)}</span>` : ''}
                ${p.pinned ? '<span class="badge badge-warning">Ghim</span>' : ''}
                ${p.category ? `<span class="badge badge-info">${p.category}</span>` : ''}
              </div>
              <p class="post-excerpt">${buildExcerpt(p.content)}</p>
              <div class="meta">Đăng bởi: ${p.createdByName || 'TEDU'} | ${formatDate(p.createdAt)}</div>
              <div style="margin-top:10px">
                <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openPostDetail(${posts.indexOf(p)})">Xem chi tiết</button>
              </div>
            </div>
          </article>
        `).join('');
      } catch (e) {
        wrap.innerHTML = `<div class="card" style="padding:18px;color:#ef4444">${e.message}</div>`;
      }
    }

    function formatDate(v) {
      if (!v) return 'N/A';
      return new Date(v).toLocaleString('vi-VN');
    }

    function normalizeUrl(url) {
      if (!url) return '';
      if (url.includes('youtu.be/')) {
        const videoId = url.split('youtu.be/')[1].split('?')[0];
        return `https://www.youtube.com/embed/${videoId}`;
      }
      if (url.includes('watch?v=')) {
        return url.replace('watch?v=', 'embed/');
      }
      return url;
    }

    function renderMedia(post) {
      const mediaUrl = post.videoUrl || '';
      const postType = post.postType || 'ANNOUNCEMENT';
      if (postType === 'ANNOUNCEMENT') {
        return `
          <div style="padding:12px 14px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-bottom:1px solid #dbeafe">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <span class="badge badge-info">Thông báo mới</span>
              ${post.pinned ? '<span class="badge badge-warning">Ghim</span>' : ''}
            </div>
          </div>
        `;
      }
      if (!mediaUrl && post.thumbnailUrl) {
        return `<img src="${post.thumbnailUrl}" alt="${post.title}" style="width:100%;height:220px;object-fit:cover;display:block" />`;
      }
      if (!mediaUrl) return '';
      if (postType === 'IMAGE' || mediaUrl.startsWith('data:image/')) {
        return `<img src="${mediaUrl}" alt="${post.title}" style="width:100%;height:220px;object-fit:cover;display:block" />`;
      }
      if (mediaUrl.startsWith('data:video/')) {
        return `<video controls style="width:100%;height:220px;display:block;background:#000"><source src="${mediaUrl}"></video>`;
      }
      if (postType === 'VIDEO' && (mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be'))) {
        return `<iframe src="${normalizeUrl(mediaUrl)}" allowfullscreen></iframe>`;
      }
      if (postType === 'VIDEO') {
        return `<video controls style="width:100%;height:220px;display:block;background:#000"><source src="${mediaUrl}"></video>`;
      }
      return `<a href="${mediaUrl}" target="_blank" rel="noopener noreferrer" style="display:block;padding:18px">Xem nội dung đính kèm</a>`;
    }

    function labelPostType(value) {
      if (value === 'VIDEO') return 'Video';
      if (value === 'IMAGE') return 'Hình ảnh';
      return 'Thông báo';
    }

    function buildExcerpt(content) {
      const text = (content || '').trim();
      if (!text) return 'Bấm để xem chi tiết bài đăng.';
      return text.length > 140 ? `${text.slice(0, 140)}...` : text;
    }

    function openPostDetail(index) {
      const post = postsCache[index];
      if (!post) return;
      document.getElementById('detail-title').textContent = post.title || 'Chi tiết bài đăng';
      document.getElementById('detail-media').innerHTML = renderDetailMedia(post);
      document.getElementById('detail-tags').innerHTML = `
        ${post.postType ? `<span class="badge badge-info">${labelPostType(post.postType)}</span>` : ''}
        ${post.pinned ? '<span class="badge badge-warning">Ghim</span>' : ''}
        ${post.category ? `<span class="badge badge-info">${post.category}</span>` : ''}
      `;
      document.getElementById('detail-content').textContent = (post.content || '').trim() || 'Không có nội dung mô tả.';
      document.getElementById('detail-meta').textContent = `Đăng bởi: ${post.createdByName || 'TEDU'} | ${formatDate(post.createdAt)}`;
      document.getElementById('post-detail').style.display = 'flex';
    }

    function closePostDetail(event) {
      if (event && event.target && event.target.id !== 'post-detail') return;
      document.getElementById('post-detail').style.display = 'none';
    }

    function renderDetailMedia(post) {
      const mediaUrl = post.videoUrl || '';
      const postType = post.postType || 'ANNOUNCEMENT';
      if (postType === 'ANNOUNCEMENT' && !mediaUrl && !post.thumbnailUrl) {
        return '';
      }
      if (postType === 'IMAGE' || mediaUrl.startsWith('data:image/')) {
        return `<img src="${mediaUrl || post.thumbnailUrl}" alt="${post.title}" style="width:100%;max-height:460px;object-fit:cover;display:block;border-radius:10px" />`;
      }
      if (mediaUrl.startsWith('data:video/')) {
        return `<video controls style="width:100%;max-height:460px;display:block;background:#000;border-radius:10px"><source src="${mediaUrl}"></video>`;
      }
      if (postType === 'VIDEO' && (mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be'))) {
        return `<iframe src="${normalizeUrl(mediaUrl)}" allowfullscreen style="width:100%;height:420px;border:0;border-radius:10px"></iframe>`;
      }
      if (postType === 'VIDEO') {
        return `<video controls style="width:100%;max-height:460px;display:block;background:#000;border-radius:10px"><source src="${mediaUrl}"></video>`;
      }
      if (mediaUrl) {
        return `<a href="${mediaUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">Mở nội dung đính kèm</a>`;
      }
      if (post.thumbnailUrl) {
        return `<img src="${post.thumbnailUrl}" alt="${post.title}" style="width:100%;max-height:460px;object-fit:cover;display:block;border-radius:10px" />`;
      }
      return '';
    }
  </script>
</body>
</html>
