<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử điểm danh – TEDU</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .summary-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><span>🎓</span> TEDU School</div>
    <nav class="sidebar-nav">
      <div class="nav-section">Menu</div>
      <div class="nav-item" onclick="location.href='dashboard.html'"><i class="fa fa-home"></i> Trang chủ</div>
      <div class="nav-item" onclick="location.href='classes.html'"><i class="fa fa-school"></i> Lớp học của tôi</div>
      <div class="nav-item" onclick="location.href='students.html'"><i class="fa fa-users"></i> Danh sách học sinh</div>
      <div class="nav-item" onclick="location.href='timetable.html'"><i class="fa fa-calendar"></i> Thời khóa biểu</div>
      <div class="nav-item active" onclick="location.href='attendance.html'"><i class="fa fa-clipboard-check"></i> Lịch sử điểm danh</div>
      <div class="nav-item" onclick="location.href='../index.html'"><i class="fa fa-video"></i> Bài đăng video</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"><i class="fa fa-user"></i></div>
        <div>
          <div class="user-name" id="sidebar-username">---</div>
          <div class="user-role" id="sidebar-role">---</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><i class="fa fa-clipboard-check"></i> Lịch sử điểm danh</div>
    </div>
    <div class="page-body">
      <div class="card">
        <div class="card-header"><span>Tổng quan</span></div>
        <div class="card-body">
          <div class="summary-grid" id="attendance-summary">
            <div class="card"><div class="card-body">Đang tải...</div></div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:20px">
        <div class="card-header"><span>Chi tiết lịch sử</span></div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Ngày</th><th>Môn học</th><th>Trạng thái</th><th>Ghi chú</th><th>Người điểm danh</th></tr>
              </thead>
              <tbody id="history-body"><tr><td colspan="5" style="text-align:center;padding:20px;color:#999">Đang tải...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    renderUserInfo();
    await loadHistory();
  });

  async function loadHistory() {
    try {
      const me = await api.students.getMe();
      const student = me.data;
      const res = await api.attendances.getByStudent(student.id);
      const records = res.data || [];
      const present = records.filter(r => r.status === 'PRESENT').length;
      const absent = records.filter(r => r.status === 'ABSENT').length;
      const late = records.filter(r => r.status === 'LATE').length;

      document.getElementById('attendance-summary').innerHTML = `
        <div class="card" style="margin:0"><div class="card-body"><strong>${records.length}</strong><div style="color:#666;font-size:.85rem">Tổng buổi</div></div></div>
        <div class="card" style="margin:0"><div class="card-body"><strong style="color:#2d9e5c">${present}</strong><div style="color:#666;font-size:.85rem">Có mặt</div></div></div>
        <div class="card" style="margin:0"><div class="card-body"><strong style="color:#f72585">${absent}</strong><div style="color:#666;font-size:.85rem">Vắng</div></div></div>
        <div class="card" style="margin:0"><div class="card-body"><strong style="color:#ff9500">${late}</strong><div style="color:#666;font-size:.85rem">Đi muộn</div></div></div>
      `;

      const tbody = document.getElementById('history-body');
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#999">Chưa có lịch sử điểm danh</td></tr>';
        return;
      }
      tbody.innerHTML = records.map(r => `
        <tr>
          <td>${r.attendanceDate || '—'}</td>
          <td>${r.subject || '—'}</td>
          <td><span class="badge ${r.status === 'PRESENT' ? 'badge-success' : r.status === 'LATE' ? 'badge-warning' : 'badge-danger'}">${r.status === 'PRESENT' ? 'Có mặt' : r.status === 'LATE' ? 'Đi muộn' : 'Vắng'}</span></td>
          <td>${r.note || '—'}</td>
          <td>${r.markedByName || '—'}</td>
        </tr>
      `).join('');
    } catch (e) {
      document.getElementById('history-body').innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;color:#f44">${e.message}</td></tr>`;
    }
  }
</script>
</body>
</html>
