<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lớp học – TEDU</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand"><span>🎓</span> TEDU School</div>
    <nav class="sidebar-nav">
      <div class="nav-section">Menu</div>
      <div class="nav-item" onclick="location.href='dashboard.html'"><i class="fa fa-home"></i> Trang chủ</div>
      <div class="nav-item active" onclick="location.href='classes.html'"><i class="fa fa-school"></i> Lớp học</div>
      <div class="nav-item" onclick="location.href='students.html'"><i class="fa fa-users"></i> Danh sách học sinh</div>
      <div class="nav-item" onclick="location.href='timetable.html'"><i class="fa fa-calendar"></i> Thời khóa biểu</div>
      <div class="nav-item" onclick="location.href='../index.html'"><i class="fa fa-video"></i> Bài đăng video</div>
      <div class="nav-item" onclick="location.href='attendance.html'"><i class="fa fa-clipboard-check"></i> Lịch sử điểm danh</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"><i class="fa fa-user"></i></div>
        <div>
          <div class="user-name" id="sidebar-username">---</div>
          <div class="user-role" id="sidebar-role">---</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><i class="fa fa-school"></i> Danh sách lớp học</div>
    </div>
    <div class="page-body">

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px" id="classes-grid">
        <div style="text-align:center;color:#aaa;padding:40px;grid-column:1/-1">Đang tải...</div>
      </div>

    </div>
  </div>
</div>

<!-- Students of class modal -->
<div class="modal-backdrop" id="students-modal">
  <div class="modal">
    <div class="modal-header">
      <span id="students-modal-title">Học sinh lớp</span>
      <button class="modal-close" onclick="closeModal('students-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Họ tên</th><th>Ngày sinh</th><th>SĐT</th><th>Trạng thái</th></tr></thead>
          <tbody id="class-students-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    renderUserInfo();
    await loadClasses();
  });

  async function loadClasses() {
    try {
      const res = await api.classes.getAll();
      const grid = document.getElementById('classes-grid');
      if (!res.data.length) {
        grid.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;grid-column:1/-1">Chưa có lớp nào</div>';
        return;
      }
      grid.innerHTML = res.data.map(c => `
        <div class="card" style="cursor:pointer" onclick="viewStudents(${c.id}, '${c.className}')">
          <div class="card-body">
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
              <div class="stat-icon bg-purple" style="width:46px;height:46px;font-size:1.2rem"><i class="fa fa-school"></i></div>
              <div>
                <div style="font-size:1.2rem;font-weight:700">${c.className}</div>
                <div style="color:#888;font-size:.82rem">Khối ${c.grade || '?'} · ${c.schoolYear || 'N/A'}</div>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:.85rem;color:#666">
              <span><i class="fa fa-chalkboard-teacher"></i> ${c.teacherName || 'Chưa phân công'}</span>
              <span><i class="fa fa-users"></i> ${c.studentCount} HS</span>
            </div>
          </div>
        </div>
      `).join('');
    } catch (e) { showToast(e.message, 'error'); }
  }

  async function viewStudents(classId, className) {
    document.getElementById('students-modal-title').textContent = `Học sinh lớp ${className}`;
    try {
      const res = await api.students.byClass(classId);
      const body = document.getElementById('class-students-body');
      const students = res.data;
      if (!students.length) {
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#aaa">Lớp chưa có học sinh</td></tr>';
      } else {
        body.innerHTML = students.map((s, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${s.fullName}</td>
            <td>${s.dob ? new Date(s.dob).toLocaleDateString('vi-VN') : '—'}</td>
            <td>${s.phone || '—'}</td>
            <td><span class="badge ${s.status === 'ACTIVE' ? 'badge-success' : 'badge-danger'}">${s.status === 'ACTIVE' ? 'Đang học' : s.status}</span></td>
          </tr>
        `).join('');
      }
    } catch (e) { console.error(e); }
    openModal('students-modal');
  }
</script>
</body>
</html>
