<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch dạy giáo viên - TEDU</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="sidebar-brand"><span>🎓</span> TEDU</div><nav class="sidebar-nav"><div class="nav-section">Quản lý</div></nav><div class="sidebar-footer"><div class="user-info"><div class="user-avatar"><i class="fa fa-user"></i></div><div><div class="user-name" id="sidebar-username">---</div><div class="user-role" id="sidebar-role">---</div></div></div><button class="btn-logout" onclick="logout()">Đăng xuất</button></div></aside>
<main class="main-content"><div class="topbar"><div class="topbar-title"><i class="fa fa-chalkboard-teacher"></i> Lịch dạy giáo viên</div></div><div class="page-body"><div class="card"><div class="card-body" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div class="form-group"><label>Tuần bắt đầu</label><input type="date" id="from"></div><button class="btn btn-primary" onclick="loadWeek()">Xem lịch</button><span id="stats" class="badge badge-info"></span></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Thời gian</th><th>Lớp</th><th>Môn</th><th>Giáo viên</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div>
<div class="modal-backdrop" id="session-modal"><div class="modal"><div class="modal-header"><span>Cập nhật buổi dạy</span><button class="modal-close" onclick="closeModal('session-modal')">✕</button></div><div class="modal-body"><input type="hidden" id="session-id"><div class="form-grid single"><div class="form-group"><label>Trạng thái</label><select id="session-status"><option value="TAUGHT">Đã dạy</option><option value="NOT_TAUGHT">Không dạy</option><option value="SCHEDULED">Chưa cập nhật</option></select></div><div class="form-group"><label>Giáo viên thay (nếu có)</label><select id="substitute"><option value="">Không có</option></select></div><div class="form-group"><label>Ghi chú</label><textarea id="session-note"></textarea></div></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('session-modal')">Hủy</button><button class="btn btn-primary" onclick="saveSession()">Lưu</button></div></div></div>
<script src="../js/api.js"></script><script>
let sessions=[],teachers=[];
document.addEventListener('DOMContentLoaded',async()=>{if(!requireAuth()||!['ADMIN','ACADEMIC_AFFAIRS'].includes(getUser()?.role))return;renderUserInfo();const d=new Date();const day=d.getDay()||7;d.setDate(d.getDate()-day+1);document.getElementById('from').value=iso(d);try{teachers=(await api.teachers.getAll()).data||[]}catch(e){}await loadWeek()});
function iso(d){return d.toISOString().slice(0,10)}function range(){const from=new Date(document.getElementById('from').value+'T00:00:00'),to=new Date(from);to.setDate(to.getDate()+6);return [iso(from),iso(to)]}
async function loadWeek(){try{const [from,to]=range();sessions=(await api.teachingSessions.getWeek(from,to)).data||[];const st=(await api.teachingSessions.getStats(from,to)).data;document.getElementById('stats').textContent=`Đã dạy ${st.display} buổi`;render()}catch(e){showToast(e.message,'error')}}
function render(){document.getElementById('rows').innerHTML=sessions.map(s=>`<tr><td>${new Date(s.date+'T00:00:00').toLocaleDateString('vi-VN')}</td><td>${s.startTime} - ${s.endTime}</td><td>${s.className}</td><td>${s.subject}</td><td>${s.substituteTeacherName||s.teacherName||'Chưa phân công'}</td><td><span class="badge ${s.status==='TAUGHT'?'badge-success':s.status==='NOT_TAUGHT'?'badge-danger':'badge-warning'}">${s.status==='TAUGHT'?'Đã dạy':s.status==='NOT_TAUGHT'?'Không dạy':'Chưa cập nhật'}</span></td><td><button class="btn btn-outline btn-sm" onclick="edit(${s.id})"><i class="fa fa-edit"></i> Cập nhật</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px">Không có lịch trong tuần</td></tr>'}
function edit(id){const s=sessions.find(x=>x.id===id);document.getElementById('session-id').value=id;document.getElementById('session-status').value=s.status;document.getElementById('session-note').value=s.note||'';document.getElementById('substitute').innerHTML='<option value="">Không có</option>'+teachers.map(t=>`<option value="${t.id}" ${t.id===s.substituteTeacherId?'selected':''}>${t.fullName}</option>`).join('');openModal('session-modal')}
async function saveSession(){try{await api.teachingSessions.update(document.getElementById('session-id').value,{status:document.getElementById('session-status').value,substituteTeacherId:document.getElementById('substitute').value||null,note:document.getElementById('session-note').value});closeModal('session-modal');await loadWeek();showToast('Đã cập nhật buổi dạy','success')}catch(e){showToast(e.message,'error')}}
</script></body></html>
