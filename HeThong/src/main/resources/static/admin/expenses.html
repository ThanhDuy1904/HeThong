<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiêu - TEDU</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-brand"><span>🎓</span> TEDU</div><nav class="sidebar-nav"></nav><div class="sidebar-footer"><div class="user-info"><div class="user-avatar"><i class="fa fa-user"></i></div><div><div class="user-name" id="sidebar-username">---</div><div class="user-role" id="sidebar-role">---</div></div></div><button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button></div></aside><main class="main-content"><div class="topbar"><div class="topbar-title"><i class="fa fa-receipt"></i> Quản lý chi tiêu</div></div><div class="page-body"><div class="card"><div class="card-header">Lập phiếu chi</div><div class="card-body"><div id="available" style="font-weight:700;color:#2d9e5c;margin-bottom:15px">Số tiền khả dụng: ...</div><form id="expense-form"><div class="form-grid"><div class="form-group"><label>Loại chi tiêu</label><select name="category" required><option value="Điện">Phiếu điện</option><option value="Nước">Phiếu nước</option><option value="Mặt bằng">Mặt bằng</option><option value="Khác">Phiếu khác</option></select></div><div class="form-group"><label>Tên khoản chi khác</label><input name="description" placeholder="Nhập tên nếu chọn Phiếu khác"></div><div class="form-group"><label>Tháng</label><select name="month" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div><div class="form-group"><label>Năm</label><input name="year" type="number" min="2000" value="${new Date().getFullYear()}" required></div><div class="form-group"><label>Số tiền</label><input name="amount" type="number" min="1" step="1000" required></div><div class="form-group"><label>Ảnh phiếu chi (nếu có)</label><input name="image" type="file" accept="image/*"></div></div><button class="btn btn-primary" type="submit"><i class="fa fa-save"></i> Lưu phiếu chi</button></form></div></div><div class="card"><div class="card-header">Lịch sử chi tiêu</div><div class="table-wrap"><table><thead><tr><th>Loại</th><th>Nội dung</th><th>Thời gian</th><th>Số tiền</th><th>Người lập</th><th>Ảnh</th><th></th></tr></thead><tbody id="expenses"></tbody></table></div></div></div></main></div><script src="../js/api.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!requireAuth()||!['ADMIN','MANAGER'].includes(getUser()?.role))return;renderUserInfo();await loadExpenses();document.getElementById('expense-form').addEventListener('submit',saveExpense)});const money=v=>Number(v||0).toLocaleString('vi-VN')+' đ';function esc(v){return String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}async function loadExpenses(){try{const [list,available]=await Promise.all([api.expenses.list(),api.expenses.available()]);document.getElementById('available').textContent='Số tiền khả dụng: '+money(available.data);document.getElementById('expenses').innerHTML=(list.data||[]).map(e=>`<tr><td>${esc(e.category)}</td><td>${esc(e.description)||'—'}</td><td>Tháng ${e.month}/${e.year}</td><td>${money(e.amount)}</td><td>${esc(e.createdBy)||'—'}</td><td>${e.imageName?`<a href="${api.expenses.imageUrl(e.id)}" target="_blank">Xem ảnh</a>`:'—'}</td><td><button class="btn btn-danger btn-sm" onclick="removeExpense(${e.id})"><i class="fa fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:25px">Chưa có phiếu chi</td></tr>'}catch(e){showToast(e.message,'error')}}async function saveExpense(ev){ev.preventDefault();try{const form=new FormData(ev.target);await api.expenses.create(form);ev.target.reset();await loadExpenses();showToast('Đã lưu phiếu chi','success')}catch(e){showToast(e.message,'error')}}async function removeExpense(id){if(!confirm('Bạn có chắc muốn xóa phiếu chi này?'))return;try{await api.expenses.delete(id);await loadExpenses();showToast('Đã xóa phiếu chi','success')}catch(e){showToast(e.message,'error')}}</script></body></html>
