<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lưu trữ - TEDU</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="sidebar-brand"><span>🎓</span> TEDU</div><nav class="sidebar-nav"><div class="nav-section">Quản lý</div></nav><div class="sidebar-footer"><div class="user-info"><div class="user-avatar"><i class="fa fa-user"></i></div><div><div class="user-name" id="sidebar-username">---</div><div class="user-role" id="sidebar-role">---</div></div></div><button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Đăng xuất</button></div></aside>
<main class="main-content"><div class="topbar"><div class="topbar-title"><i class="fa fa-folder-open"></i> Lưu trữ tài liệu</div></div><div class="page-body"><div class="card"><div class="card-header"><span>File và hình ảnh dùng chung</span><label class="btn btn-primary"><i class="fa fa-upload"></i> Tải lên<input type="file" id="file" hidden onchange="uploadFile(this.files[0])"></label></div><div class="table-wrap"><table><thead><tr><th>Tên file</th><th>Loại</th><th>Kích thước</th><th>Người tải</th><th>Ngày tải</th><th></th></tr></thead><tbody id="files"></tbody></table></div></div></div></main></div>
<script src="../js/api.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!requireAuth()||!['ADMIN','ACADEMIC_AFFAIRS','MANAGER'].includes(getUser()?.role))return;renderUserInfo();await loadFiles()});async function loadFiles(){try{const r=await api.archive.list();document.getElementById('files').innerHTML=(r.data||[]).map(f=>`<tr><td><i class="fa fa-file"></i> ${f.originalName}</td><td>${f.contentType}</td><td>${Math.ceil(f.size/1024)} KB</td><td>${f.uploadedBy}</td><td>${new Date(f.createdAt).toLocaleString('vi-VN')}</td><td><button class="btn btn-outline btn-sm" onclick="downloadFile(${f.id},${JSON.stringify(f.originalName)})"><i class="fa fa-download"></i> Tải xuống</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:30px;color:#888">Chưa có tài liệu</td></tr>'}catch(e){showToast(e.message,'error')}}async function downloadFile(id,name){try{await api.archive.download(id,name)}catch(e){showToast(e.message,'error')}}async function uploadFile(file){if(!file)return;try{await api.archive.upload(file);await loadFiles();showToast('Đã tải lên','success')}catch(e){showToast(e.message,'error')}}</script></body></html>
