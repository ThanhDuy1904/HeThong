spring.application.name=HeThong

# ============ DataSource ============
spring.datasource.url=jdbc:mysql://localhost:3306/tedu_data?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / Hibernate ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============ Server ============
server.port=8090

# ============ JWT ============
app.jwt.secret=TeduSecretKey2026!@#SuperLongSecretKeyForHMACSHA256Algorithm
app.jwt.expiration-ms=86400000

# ============ CORS ============
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
